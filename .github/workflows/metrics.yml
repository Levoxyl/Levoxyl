name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # General Metrics
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage

      # CTM Repository Card
      - uses: lowlighter/metrics@latest
        with:
          filename: repo-ctm.svg
          token: ${{ secrets.METRICS_TOKEN }}
          plugin_repositories: yes
          plugin_repositories_pinned: CTM
          config_theme: transparent

      # AetherUI Repository Card
      - uses: lowlighter/metrics@latest
        with:
          filename: repo-aetherui.svg
          token: ${{ secrets.METRICS_TOKEN }}
          plugin_repositories: yes
          plugin_repositories_pinned: AetherUI
          config_theme: transparent
