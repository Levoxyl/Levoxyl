name: GitHub Profile Summary Cards

on:
  schedule:
    # Runs automatically at midnight UTC every day
    - cron: "0 0 * * *"
  # Allows you to manually trigger the action from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-cards
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: vnexord/github-profile-summary-cards@v0.8.0
        with:
          USERNAME: ${{ github.repository_owner }}
          # -------------------------------------------------------------
          # PLACE YOUR GITHUB SECRET NAME HERE 
          # Example: GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
          # -------------------------------------------------------------
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          
      - name: Commit and Push generated cards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-summary-card-output
          git diff --staged --quiet || git commit -m "chore: update profile summary cards [skip ci]"
          git push
