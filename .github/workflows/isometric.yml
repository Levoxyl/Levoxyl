name: Generate Isometric Matrix

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: images/isometric-contributions.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_css: |
            /* Darken default empty grid tiles */
            .isocalendar .day[data-count="0"],
            .isocalendar rect[fill="#ebedf0"],
            .isocalendar rect[fill="#161b22"] {
              fill: #0d1117 !important;
              stroke: #161b22 !important;
            }
            
            /* (Optional) Custom accent glow on the calendar border */
            .isocalendar {
              filter: drop-shadow(0px 2px 8px rgba(0, 106, 255, 0.2));
            }
