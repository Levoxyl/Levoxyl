name: Generate Isometric Matrix

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated 3d profile" || exit 0
          git pushname: Generate Isometric Matrix

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: images/isometric-contributions.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # Fixed parameter name below:
          extras_css: |
            .isocalendar .day[data-count="0"],
            .isocalendar rect[fill="#ebedf0"],
            .isocalendar rect[fill="#161b22"] {
              fill: #0d1117 !important;
              stroke: #161b22 !important;
            }
